<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root {
  --bg: #eef1fb;
  --card: #ffffff;
  --border: #e3e7f5;
  --line: #c6a664;
  --text: #2c2f45;
  --muted: #8b8fa3;
}
html,body{margin:0;padding:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.hint{font-size:12px;color:var(--muted);padding:6px 4px 10px 4px}

#stage{
  overflow-y:auto; height:640px; border-radius:12px; padding:20px 16px; position:relative;
}

#grid{
  display:flex; flex-wrap:wrap; align-items:flex-start;
}

.thumb-wrap{
  position:relative; width:150px; margin:0 2px 26px 2px;
}
.thumb-wrap.group-start{ margin-left:14px; }

.thumb-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  box-shadow:0 3px 10px rgba(44,47,69,0.08); overflow:hidden; cursor:default;
  transition: border-color .12s, box-shadow .12s;
}
.thumb-card img{ display:block; width:100%; height:auto; }

.thumb-wrap:not(.group-start) .thumb-card{ cursor:pointer; }
.thumb-wrap:not(.group-start) .thumb-card:hover{
  border-color:var(--line);
  box-shadow:0 0 0 2px rgba(198,166,100,0.35);
}

.group-divider{
  width:26px; align-self:stretch; min-height:180px; display:flex;
  align-items:center; justify-content:center; position:relative;
  margin-bottom:26px; flex:0 0 auto;
}
.divider-line{
  width:0; height:100%; border-left:3px dashed var(--line);
}
.divider-handle{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:22px; height:22px; border-radius:50%; background:#fff;
  border:2px solid var(--line); color:var(--line);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; cursor:grab; user-select:none; z-index:4;
  box-shadow:0 2px 6px rgba(0,0,0,0.12);
}
.divider-handle:active{ cursor:grabbing; }
.divider-handle .x{
  position:absolute; top:-26px; left:50%; transform:translateX(-50%);
  width:18px; height:18px; border-radius:50%; background:#fff; color:#a33;
  border:1px solid #e2b8b8; font-size:11px; line-height:16px; text-align:center;
  display:none;
}
.group-divider:hover .divider-handle .x{ display:block; }

#draghint{
  position:absolute; width:0; border-left:3px dashed var(--line);
  pointer-events:none; display:none; z-index:10; top:0;
}

.pill-block{ margin-top:8px; }
.pill{
  display:inline-block; max-width:150px; font-size:12px; font-weight:600;
  padding:4px 10px; border-radius:999px; color:#3b3f57; border:none;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:130px;
}
.page-count{ font-size:11px; color:var(--muted); margin-top:3px; padding-left:2px; }

.palette-0 .pill{ background:#fbdce6; }
.palette-1 .pill{ background:#fdeecb; }
.palette-2 .pill{ background:#cdeef0; }
.palette-3 .pill{ background:#e5dcf7; }
.palette-4 .pill{ background:#d8e6fb; }
.palette-5 .pill{ background:#d9f3df; }
</style>
</head>
<body>

<div class="hint">直接點縮圖：切換該頁是否為新文件起點。虛線把手：拖曳可移動分割點，點把手上方的 × 可刪除該分割點。標籤可直接點擊修改檔名。</div>
<div id="stage">
  <div id="grid"></div>
  <div id="draghint"></div>
</div>

<script>
const RENDER_EVENT = "streamlit:render";

function postToStreamlit(type, payload = {}) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
}
function componentReady() { postToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
function setComponentValue(value) { postToStreamlit("streamlit:setComponentValue", { value }); }
function setFrameHeight(height = 700) { postToStreamlit("streamlit:setFrameHeight", { height }); }

let pages = [];        // [{index, thumb_data_url, isSplit, filename}]
let dragging = null;
let pendingTargetIndex = null;

const stage = document.getElementById("stage");
const grid = document.getElementById("grid");
const draghint = document.getElementById("draghint");

function send() {
  const splits = pages
    .filter(p => p.isSplit)
    .map(p => ({ index: p.index, filename: p.filename }))
    .sort((a, b) => a.index - b.index);
  setComponentValue({ splits });
}

function groupsFromPages() {
  const groups = [];
  pages.forEach((p, i) => {
    if (p.isSplit || i === 0) {
      groups.push({ startIndex: p.index, pages: [p] });
    } else {
      groups[groups.length - 1].pages.push(p);
    }
  });
  return groups;
}

function makeEditableFilenameInput(group, paletteClass) {
  const wrap = document.createElement("div");
  wrap.className = `pill-block ${paletteClass}`;

  const input = document.createElement("input");
  input.className = "pill";
  input.type = "text";
  input.value = group.pages[0].filename || "";
  input.title = input.value;
  input.addEventListener("input", (e) => { group.pages[0].filename = e.target.value; });
  input.addEventListener("change", () => send());
  wrap.appendChild(input);

  const count = document.createElement("div");
  count.className = "page-count";
  count.textContent = `${group.pages.length} 頁`;
  wrap.appendChild(count);

  return wrap;
}

function render() {
  grid.innerHTML = "";
  const groups = groupsFromPages();
  const palette = ["palette-0", "palette-1", "palette-2", "palette-3", "palette-4", "palette-5"];

  groups.forEach((group, gIdx) => {
    if (gIdx !== 0) {
      const divider = document.createElement("div");
      divider.className = "group-divider";
      divider.dataset.index = group.startIndex;

      const line = document.createElement("div");
      line.className = "divider-line";
      divider.appendChild(line);

      const handle = document.createElement("div");
      handle.className = "divider-handle";
      handle.textContent = "⠿";
      handle.dataset.index = group.startIndex;
      handle.addEventListener("mousedown", onHandleMouseDown);

      const xBtn = document.createElement("div");
      xBtn.className = "x";
      xBtn.textContent = "×";
      xBtn.title = "刪除此分割點";
      xBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const target = pages.find(pg => pg.index === group.startIndex);
        if (target) target.isSplit = false;
        render();
        send();
      });
      handle.appendChild(xBtn);

      divider.appendChild(handle);
      grid.appendChild(divider);
    }

    group.pages.forEach((p, pIdxInGroup) => {
      const wrap = document.createElement("div");
      wrap.className = "thumb-wrap" + (pIdxInGroup === 0 ? " group-start" : "");
      wrap.dataset.index = p.index;

      const card = document.createElement("div");
      card.className = "thumb-card";
      card.title = pIdxInGroup !== 0 ? "點擊：在此新增分割點" : "";
      const img = document.createElement("img");
      img.src = p.thumb_data_url;
      card.appendChild(img);

      if (pIdxInGroup !== 0) {
        card.addEventListener("click", () => {
          p.isSplit = true;
          p.filename = p.filename || `文件_${p.index + 1}`;
          render();
          send();
        });
      }

      wrap.appendChild(card);

      if (pIdxInGroup === 0) {
        wrap.appendChild(makeEditableFilenameInput(group, palette[gIdx % palette.length]));
      }

      grid.appendChild(wrap);
    });
  });
}

function thumbRects() {
  return Array.from(grid.querySelectorAll(".thumb-wrap")).map(el => {
    const r = el.getBoundingClientRect();
    return { index: Number(el.dataset.index), cx: r.left, cy: r.top + r.height / 2, top: r.top, left: r.left };
  });
}

function onHandleMouseDown(e) {
  const originIndex = Number(e.currentTarget.dataset.index);
  dragging = { originIndex };
  pendingTargetIndex = null;
  draghint.style.display = "block";
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
  e.preventDefault();
  e.stopPropagation();
}

function onDragMove(e) {
  if (!dragging) return;
  const rects = thumbRects().filter(r => r.index !== 0);
  if (!rects.length) return;

  let nearest = rects[0];
  let best = Infinity;
  rects.forEach(r => {
    const d = Math.hypot(r.cx - e.clientX, r.cy - e.clientY);
    if (d < best) { best = d; nearest = r; }
  });
  pendingTargetIndex = nearest.index;

  const stageRect = stage.getBoundingClientRect();
  draghint.style.left = `${nearest.left - stageRect.left + stage.scrollLeft - 4}px`;
  draghint.style.top = `${nearest.top - stageRect.top + stage.scrollTop}px`;
  draghint.style.height = "210px";
}

function onDragEnd() {
  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);
  draghint.style.display = "none";

  if (dragging && pendingTargetIndex !== null) {
    const origin = pages.find(p => p.index === dragging.originIndex);
    const target = pages.find(p => p.index === pendingTargetIndex);

    if (origin && target && target.index !== 0) {
      if (!target.isSplit || target.index === origin.index) {
        const filename = origin.filename;
        if (origin.index !== 0) origin.isSplit = false;
        target.isSplit = true;
        target.filename = target.index === origin.index ? (target.filename || filename) : filename;
        render();
        send();
      }
    }
  }
  dragging = null;
  pendingTargetIndex = null;
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== RENDER_EVENT || !data.args) return;

  const args = data.args;
  pages = (args.pages || []).map(p => ({
    index: p.index,
    thumb_data_url: p.thumb_data_url,
    isSplit: !!p.is_split,
    filename: p.filename || "",
  }));

  render();
  setFrameHeight(700);
});

componentReady();
setFrameHeight(700);
</script>
</body>
</html>
