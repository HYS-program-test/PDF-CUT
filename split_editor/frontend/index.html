<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root {
  --sb-green: #00704A;
  --sb-green-dark: #063528;
  --sb-cream: #F2EFE4;
  --sb-gold: #C6A664;
  --sb-white: #ffffff;
}
html,body{margin:0;padding:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--sb-cream);color:var(--sb-green-dark)}
.hint{font-size:12px;color:#6b6b6b;padding:6px 4px 10px 4px}
#stage{position:relative;overflow-y:auto;overflow-x:hidden;height:640px;border:1px solid rgba(0,112,74,.15);border-radius:12px;background:var(--sb-white);padding:10px 14px}
#pageList{position:relative}

.split-marker{
  position:relative;
  border-top:3px dashed var(--sb-gold);
  margin:16px 0 8px 0;
  padding-top:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.badge{
  position:absolute; top:-13px; left:8px;
  background:var(--sb-green); color:#fff; font-size:11px; font-weight:700;
  padding:2px 10px; border-radius:999px;
}
.handle{
  cursor:grab; user-select:none; font-size:14px; color:var(--sb-gold);
  padding:3px 6px; border:1px solid var(--sb-gold); border-radius:6px; background:#fff;
  flex:0 0 auto;
}
.handle:active{cursor:grabbing}
.fname-input{
  flex:1 1 auto; font-size:13px; padding:5px 8px; border:1px solid #d9d2bd;
  border-radius:6px; color:var(--sb-green-dark);
}
.remove-btn{
  flex:0 0 auto; font-size:12px; border:1px solid #e2b8b8; color:#a33; background:#fff;
  border-radius:6px; padding:4px 8px; cursor:pointer;
}
.remove-btn:hover{background:#fdeeee}

.add-zone{height:14px; position:relative; margin:2px 0;}
.add-btn{
  display:none; position:absolute; left:50%; top:-9px; transform:translateX(-50%);
  font-size:11px; padding:2px 10px; border-radius:999px; border:1px dashed var(--sb-green);
  background:#eefaf3; color:var(--sb-green); cursor:pointer; white-space:nowrap;
}
.add-zone:hover .add-btn{display:block}
.add-zone:hover{background:rgba(0,112,74,0.05); border-radius:6px}

.page-card{
  border:1px solid rgba(0,112,74,.15); border-radius:10px; padding:8px; background:#fff;
  box-shadow:0 2px 6px rgba(6,53,40,.06);
}
.page-card img{display:block; width:200px; max-width:100%; height:auto; margin:0 auto; border-radius:4px}
.page-label{text-align:center; font-size:12px; font-weight:600; color:var(--sb-green-dark); margin-top:4px}

#dragline{
  position:absolute; left:0; right:0; height:0; border-top:4px dashed var(--sb-green);
  pointer-events:none; display:none; z-index:10;
}
</style>
</head>
<body>

<div class="hint">拖曳灰金色把手 ⠿ 可移動分割線；把滑鼠移到頁面縫隙會出現「＋ 在此分割」；虛線上可直接改檔名。</div>
<div id="stage">
  <div id="pageList"></div>
  <div id="dragline"></div>
</div>

<script>
const RENDER_EVENT = "streamlit:render";

function postToStreamlit(type, payload = {}) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
}
function componentReady() { postToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
function setComponentValue(value) { postToStreamlit("streamlit:setComponentValue", { value }); }
function setFrameHeight(height = 720) { postToStreamlit("streamlit:setFrameHeight", { height }); }

let pages = [];       // [{index, thumb_data_url, isSplit, filename}]
let dragging = null;  // {originIndex}
let pendingSnapIndex = null;

const stage = document.getElementById("stage");
const pageList = document.getElementById("pageList");
const dragline = document.getElementById("dragline");

function send() {
  const splits = pages
    .filter(p => p.isSplit)
    .map(p => ({ index: p.index, filename: p.filename }))
    .sort((a, b) => a.index - b.index);
  setComponentValue({ splits });
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function render() {
  pageList.innerHTML = "";

  pages.forEach((p, i) => {
    if (p.isSplit) {
      const marker = document.createElement("div");
      marker.className = "split-marker";
      marker.dataset.index = p.index;

      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = p.index === 0 ? "第一份文件" : "新文件開始";
      marker.appendChild(badge);

      const handle = document.createElement("div");
      handle.className = "handle";
      handle.textContent = "⠿⠿⠿";
      handle.dataset.index = p.index;
      handle.addEventListener("mousedown", onHandleMouseDown);
      marker.appendChild(handle);

      const input = document.createElement("input");
      input.className = "fname-input";
      input.type = "text";
      input.value = p.filename || "";
      input.dataset.index = p.index;
      input.addEventListener("input", (e) => { p.filename = e.target.value; });
      input.addEventListener("change", () => send());
      marker.appendChild(input);

      if (p.index !== 0) {
        const rm = document.createElement("button");
        rm.className = "remove-btn";
        rm.textContent = "✕ 取消分割";
        rm.addEventListener("click", () => {
          p.isSplit = false;
          render();
          send();
        });
        marker.appendChild(rm);
      }

      pageList.appendChild(marker);
    } else if (i !== 0) {
      const zone = document.createElement("div");
      zone.className = "add-zone";
      const btn = document.createElement("button");
      btn.className = "add-btn";
      btn.textContent = "＋ 在此分割";
      btn.addEventListener("click", () => {
        p.isSplit = true;
        p.filename = p.filename || `文件_${p.index + 1}`;
        render();
        send();
      });
      zone.appendChild(btn);
      pageList.appendChild(zone);
    }

    const card = document.createElement("div");
    card.className = "page-card";
    card.dataset.index = p.index;
    const img = document.createElement("img");
    img.src = p.thumb_data_url;
    card.appendChild(img);
    const label = document.createElement("div");
    label.className = "page-label";
    label.textContent = `第 ${p.index + 1} 頁`;
    card.appendChild(label);
    pageList.appendChild(card);
  });
}

function pageCardRects() {
  return Array.from(pageList.querySelectorAll(".page-card")).map(el => ({
    index: Number(el.dataset.index),
    top: el.getBoundingClientRect().top,
  }));
}

function onHandleMouseDown(e) {
  const originIndex = Number(e.currentTarget.dataset.index);
  dragging = { originIndex };
  pendingSnapIndex = null;
  dragline.style.display = "block";
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
  e.preventDefault();
}

function onDragMove(e) {
  if (!dragging) return;
  const rects = pageCardRects().filter(r => r.index !== 0); // 不可移到第0頁之前
  if (!rects.length) return;

  let nearest = rects[0];
  let best = Infinity;
  rects.forEach(r => {
    const d = Math.abs(r.top - e.clientY);
    if (d < best) { best = d; nearest = r; }
  });

  pendingSnapIndex = nearest.index;

  const stageRect = stage.getBoundingClientRect();
  const lineY = nearest.top - stageRect.top + stage.scrollTop - 2;
  dragline.style.top = `${lineY}px`;
}

function onDragEnd() {
  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);
  dragline.style.display = "none";

  if (dragging && pendingSnapIndex !== null) {
    const origin = pages.find(p => p.index === dragging.originIndex);
    const target = pages.find(p => p.index === pendingSnapIndex);

    if (origin && target && target.index !== 0) {
      if (!target.isSplit || target.index === origin.index) {
        const filename = origin.filename;
        if (origin.index !== 0) origin.isSplit = false;
        target.isSplit = true;
        target.filename = target.filename && target.index === origin.index
          ? target.filename
          : filename;
        render();
        send();
      }
    }
  }
  dragging = null;
  pendingSnapIndex = null;
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== RENDER_EVENT || !data.args) return;

  const args = data.args;
  pages = (args.pages || []).map(p => ({
    index: p.index,
    thumb_data_url: p.thumb_data_url,
    isSplit: !!p.is_split,
    filename: p.filename || "",
  }));

  render();
  setFrameHeight(720);
});

componentReady();
setFrameHeight(720);
</script>
</body>
</html>
